# Semgrep rules for references/supply-chain-and-build-integrity.md
#
# Each rule id is `eng-rulebook.<lane>.<slug>` and each message names the rule it enforces, so a CI
# failure is traceable to a line of the standard rather than to an unexplained lint id.
#
# Tested against a labelled fixture and real repositories before shipping — see
# checks/README.md § Validation.

rules:
  - id: eng-rulebook.supply-chain-and-build-integrity.workflow-unpinned-action
    languages: [generic]
    severity: ERROR
    message: >-
      eng-rulebook/supply-chain-and-build-integrity.md §3.1: every CI step is pinned by trust
      class — a third-party action referenced by tag or branch (`@v4`, `@main`) resolves to
      whatever that ref points at on the day it runs, which is how a compromised action ships
      into your pipeline with no diff on your side. Pin to a full 40-hex commit SHA (keep the
      human-readable version in a comment). This is the pattern-matchable slice of
      [supply-chain-and-build-integrity.GR1]; a dedicated workflow linter covers the rest.
    paths:
      include:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
    # Line-anchored so YAML comments don't match; requires an @ref, so local (`./action`) refs
    # are out of scope by shape. Two pinned forms pass: a 40-hex git SHA, and a
    # `docker://…@sha256:<64-hex>` image digest — both followed by a word boundary.
    pattern-regex: '(?m)^\s*-?\s*uses:\s*[''"]?[^@''"\s#]+@(?!([0-9a-fA-F]{40}|sha256:[0-9a-fA-F]{64})\b)\S+'
