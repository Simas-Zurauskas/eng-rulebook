# Optional legacy detector; preserve project gates and triage matches using current guides.
# Semgrep rules for references/security.md (PHP).
#
# Rule ids are `eng-rulebook.<lane>.<slug>` and each message names the rule it enforces, so a CI
# failure is traceable to a line of the standard rather than to an unexplained id.
# Validated against 3,441 .php files from three mature projects — see the archived pre-v10 checks/README.md validation notes.

rules:
  - id: eng-rulebook.security.php-unserialize-no-allowlist
    languages: [php]
    severity: ERROR
    message: >-
      security.md SEC5: Object deserialization can invoke attacker-controlled behavior. Trace payload trust and integrity; prefer safe data formats or constrain allowed classes with the actual threat in mind.
    pattern-either:
      - pattern: unserialize($X)
      - pattern: \unserialize($X)
    paths:
      exclude:
        - "*Test.php"
        - "Tests/"
        - "tests/"
        - "spec/"
        - "examples/"
        - "benchmarks/"
        - "vendor/"
  - id: eng-rulebook.security.php-extract-into-scope
    languages: [php]
    severity: ERROR
    message: >-
      php-typing.md PHPTYPE2: extract() can overwrite local authority/state from array keys. Trace the source, allowed keys and flags before judging the effect.
    pattern-either:
      - pattern: extract(...)
      - pattern: \extract(...)
    paths:
      exclude:
        - "*Test.php"
        - "Tests/"
        - "tests/"
        - "spec/"
        - "examples/"
        - "benchmarks/"
        - "vendor/"
  - id: eng-rulebook.security.php-dynamic-code-execution
    languages: [php]
    severity: ERROR
    message: >-
      security.md SEC5: Dynamic code execution is unsafe for attacker-controlled content. Inspect reachability and use explicit validated dispatch where it solves the actual requirement.
    pattern-either:
      - pattern: eval(...)
      - pattern: create_function(...)
      - pattern: \create_function(...)
    paths:
      exclude:
        - "*Test.php"
        - "Tests/"
        - "tests/"
        - "spec/"
        - "examples/"
        - "benchmarks/"
        - "vendor/"
  - id: eng-rulebook.security.php-shell-execution
    languages: [php]
    severity: WARNING
    message: >-
      security.md SEC5: Shell execution needs safe argument boundaries. Trace input and shell parsing; legitimate fixed or correctly escaped operations are not automatically defects.
    pattern-either:
      - pattern: exec(...)
      - pattern: \exec(...)
      - pattern: shell_exec(...)
      - pattern: \shell_exec(...)
      - pattern: system(...)
      - pattern: \system(...)
      - pattern: passthru(...)
      - pattern: \passthru(...)
      - pattern: popen(...)
      - pattern: \popen(...)
      - pattern: proc_open(...)
      - pattern: \proc_open(...)
    paths:
      exclude:
        - "*Test.php"
        - "Tests/"
        - "tests/"
        - "spec/"
        - "examples/"
        - "benchmarks/"
        - "vendor/"
