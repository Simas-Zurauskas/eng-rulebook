# Optional legacy detector; preserve project gates and triage matches using current guides.
# Semgrep rules for references/python-typing.md — the gaps ruff does not cover.
#
# ruff PGH003/PGH004 already reject bare `# type: ignore` and `# noqa` (python-typing.md checks) and
# are the primary mechanism. These add the escape hatch ruff has no rule for.

rules:
  - id: eng-rulebook.python-typing.cast-to-any
    languages: [python]
    severity: ERROR
    message: >-
      python-typing.md PYTYPE1: Casting to Any discards downstream checking. Inspect the boundary and prefer a known type or narrowing; this match alone does not prove a runtime defect.
    pattern-either:
      - pattern: cast(Any, ...)
      - pattern: typing.cast(Any, ...)
    paths:
      exclude:
        - "test_*.py"
        - "*_test.py"
        - "tests/"
        - "conftest.py"
        - "benchmarks/"
        - "examples/"
        - "scripts/"
  - id: eng-rulebook.python-typing.cast-surface
    languages: [python]
    severity: INFO
    message: >-
      python-typing.md PYTYPE2: cast() supplies no runtime proof. Verify the invariant or parsed boundary and explain non-obvious assumptions. Repetition alone does not require a helper.
    patterns:
      - pattern-either:
          - pattern: cast($T, ...)
          - pattern: typing.cast($T, ...)
      - pattern-not: cast(Any, ...)
      - pattern-not: typing.cast(Any, ...)
    paths:
      exclude:
        - "test_*.py"
        - "*_test.py"
        - "tests/"
        - "conftest.py"
        - "benchmarks/"
        - "examples/"
        - "scripts/"
