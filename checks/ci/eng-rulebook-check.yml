# Reusable CI fragment for the eng-rulebook guard rails.
#
# Copy into .github/workflows/ and adjust the install step to the repo's package manager.
# It is a STARTING POINT, not a drop-in: every repo owns its own runtime version and install
# command (tooling-and-workspace.md), so pinning those here would be the cross-repo drift this
# library exists to prevent.
#
# What it runs, and which standard requires it:
#   typecheck   the repo's declared checker, standalone and independent of any build —
#               type-safety.md (TypeScript) / python-typing.md §2.1 / php-typing.md §2.2
#   lint        the repo's lint gate — type-safety.md GR2 / python-typing.md GR2 / php-typing.md GR1
#   semgrep     the checks/semgrep rules; each message names the rule it enforces. The directory
#               holds rules for all three languages and each file declares its own `languages:`,
#               so pointing at the directory is correct whatever the stack.
#   deps        security.md §10 — severity-gated: critical/high block, lower severities get
#               scheduled triage rather than silence
#   secrets     security.md §6 — a deterministic scanner, not a model reading the diff
#
# THE JOB BELOW IS THE TYPESCRIPT LANE. The Python and PHP lanes are at the bottom of this file.
# Copy the one that matches the repo — a workspace with repos in two languages runs two jobs, not
# one job with conditionals: a skipped step and a passing step look identical in a run summary.
#
# Pin every action to a full commit SHA before using this in anger
# (supply-chain-and-build-integrity.md). The `@vN` refs below are placeholders and are the exact
# thing that standard forbids — they are left visible rather than filled in with SHAs that would
# be stale by the time you read this.

name: eng-rulebook

on:
  pull_request:
  push:
    branches: [main, master]

# supply-chain-and-build-integrity.md: least-privilege token at the top level.
permissions:
  contents: read

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@vN   # PIN TO A SHA

      - uses: actions/setup-node@vN # PIN TO A SHA
        with:
          node-version-file: .nvmrc   # or `node-version:` matching engines.node

      # tooling-and-workspace.md: install from the lockfile, frozen. Adjust to your manager.
      - run: npm ci

      # type-safety.md: standalone, so a passing framework build cannot mask a type error.
      - run: npx tsc --noEmit

      # type-safety.md §2.4: prove the type-aware rules are actually RUNNING. A peer-range
      # mismatch between the compiler and typescript-eslint makes them stop applying without
      # failing anything, so a green lint step is otherwise indistinguishable from no lint step.
      - name: assert type-aware lint is live
        run: |
          echo "Point this at a fixture with a known no-unsafe-* violation and fail if the"
          echo "linter does not report it. Left unwired deliberately (see the secret-scan note)."
          exit 1

      - run: npx eslint .

      # The library's own pattern rules. Continues on findings so the job reports ALL of them in
      # one run rather than stopping at the first; the severity gate is the next step's job.
      - name: semgrep (standards rules)
        run: |
          python3 -m pip install --quiet semgrep
          # Only ERROR-severity rules block. The WARNING/INFO rules are surface-it by design
          # (checks/README.md § Validation) — gating on them erases the distinction the rule
          # messages spend their prose making, and gets the whole step disabled.
          semgrep --config .claude/skills/eng-rulebook/checks/semgrep/ \
                  --severity ERROR --error --quiet .
          semgrep --config .claude/skills/eng-rulebook/checks/semgrep/ \
                  --severity WARNING --severity INFO --quiet . || true

      # security.md §10: severity-gated. `--audit-level=high` is the threshold the standard
      # states; findings below it must be triaged on a schedule, not discarded.
      - name: dependency audit (critical/high block)
        run: npm audit --audit-level=high

      # security.md §6 + its Guard rails: a deterministic scanner first. An LLM read of the diff
      # is a fallback, never the check — and whichever ran must be recorded.
      - name: secret scan
        run: |
          echo "Wire a deterministic scanner here (e.g. gitleaks, or the platform's push"
          echo "protection). Left unwired deliberately: a step that pretends to scan is worse"
          echo "than an absent one, because it reads as covered."
          exit 1

# ------------------------------------------------------------------------------------------------
# OPTIONAL: /eng-rulebook check on every PR, as a job.
#
# The diff-scoped check (SKILL.md § Check mode) is agent-invoked, so by default its per-PR
# cadence rests on habit — the one enforcement channel this library otherwise refuses to rely
# on. Two ways to make it structural; do at least one:
#
#   (a) PR ritual (no infrastructure): add a required checkbox to the PR template —
#         - [ ] `/eng-rulebook check` run — findings attached, or "none"
#       and have review reject PRs with the box unticked. Cheap, and it keeps the human owner.
#
#   (b) CI job (below): run the check headlessly via an agent CLI. Uncomment and adapt.
#       Pin the action/CLI to a SHA like everything else (supply-chain §3.1); scope its token
#       to read-only; treat its rules files as security-critical config (ai-features.md §2).
#
#  eng-rulebook-check:
#    runs-on: ubuntu-latest
#    permissions:
#      contents: read
#    steps:
#      - uses: actions/checkout@vN        # PIN TO A SHA; fetch-depth: 0 for merge-base diffs
#        with:
#          fetch-depth: 0
#      # Any agent CLI able to load the skill works; e.g. Claude Code's headless mode:
#      #   npm install -g @anthropic-ai/claude-code   (pin the version)
#      #   claude -p "/eng-rulebook check origin/${{ github.base_ref }}" --allowedTools "Read,Grep,Glob,Bash(git *)"
#      # The check blocks nothing by design — post its findings as a PR comment and let the
#      # delivery process decide (references/README.md § The delivery seam).
# ------------------------------------------------------------------------------------------------

